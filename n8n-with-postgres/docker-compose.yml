services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Konfigurasi PostgreSQL — pakai Supabase yang sudah ada
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${SUPABASE_DB_HOST}      # Tailscale IP CT101, mis. 100.x.x.x
      - DB_POSTGRESDB_PORT=5432                      # direct connection, bukan pooler
      - DB_POSTGRESDB_DATABASE=postgres               # Supabase selalu pakai db "postgres"
      - DB_POSTGRESDB_USER=postgres.asdf
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=n8n                       # <-- ini kuncinya, isolasi schema

      # SSL (biasanya tidak perlu kalau lewat Tailscale internal)
      - DB_POSTGRESDB_SSL_ENABLED=false

      # Encryption
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # Network config
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${N8N_HOST}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data: