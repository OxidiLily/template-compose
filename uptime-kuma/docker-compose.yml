version: "3.8"
services:
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    restart: always
    ports:
      - "3001:3001"
    environment:
      - TZ=Asia/Jakarta
    volumes:
      - /DATA/AppData/uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  uptime-kuma-data: