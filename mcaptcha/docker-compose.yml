# mCaptcha — deploy terpisah di server yang sama
# Pakai Supabase PostgreSQL schema mcaptcha
#
# Usage:
#   1. Copy .env.mcaptcha.example → .env.mcaptcha, isi secrets
#   2. docker compose -f docker-compose-mcaptcha.yml --env-file .env.mcaptcha up -d
#   3. Buka http://localhost:7000, register admin, buat site key
#   4. Copy site_key + account_secret ke .env app OxidiLily

services:
  mcaptcha:
    image: mcaptcha/mcaptcha:latest
    container_name: mcaptcha
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      - MCAPTCHA_debug=false
      - MCAPTCHA_commercial=false
      - MCAPTCHA_source_code=https://github.com/mCaptcha/mCaptcha
      - MCAPTCHA_allow_registration=true
      - MCAPTCHA_allow_demo=false
      # Database — Supabase PG, schema mcaptcha
      - DATABASE_URL=postgres://${MCAPTCHA_DB_USER:-postgres.asdf}:${MCAPTCHA_DB_PASSWORD}@${MCAPTCHA_DB_HOST:-192.168.2.77}:${MCAPTCHA_DB_PORT:-5432}/${MCAPTCHA_DB_NAME:-oxidilily_web}?options=-c%20search_path%3Dmcaptcha
      - MCAPTCHA_database_POOL=4
      # Redis (mcaptcha custom cache)
      - MCAPTCHA_redis_URL=redis://mcaptcha_redis
      - MCAPTCHA_redis_POOL=4
      # Server
      - PORT=7000
      - MCAPTCHA_server_DOMAIN=${MCAPTCHA_DOMAIN:-localhost}
      - MCAPTCHA__server_COOKIE_SECRET=${MCAPTCHA_COOKIE_SECRET}
      - MCAPTCHA__server_IP=0.0.0.0
      # Captcha
      - MCAPTCHA_captcha_SALT=${MCAPTCHA_CAPTCHA_SALT}
      - MCAPTCHA_captcha_GC=30
      - MCAPTCHA_captcha_RUNNERS=4
      - MCAPTCHA_captcha_QUEUE_LENGTH=2000
      - MCAPTCHA_captcha_ENABLE_STATS=true
      - MCAPTCHA_captcha_DEFAULT_DIFFICULTY_STRATEGY_avg_traffic_difficulty=50000
      - MCAPTCHA_captcha_DEFAULT_DIFFICULTY_STRATEGY_peak_sustainable_traffic_difficulty=3000000
      - MCAPTCHA_captcha_DEFAULT_DIFFICULTY_STRATEGY_broke_my_site_traffic_difficulty=5000000
      - MCAPTCHA_captcha_DEFAULT_DIFFICULTY_STRATEGY_duration=30
      - MCAPTCHA_captcha_DEFAULT_DIFFICULTY_STRATEGY_avg_traffic_time=1
      - MCAPTCHA_captcha_DEFAULT_DIFFICULTY_STRATEGY_peak_sustainable_traffic_time=3
      - MCAPTCHA_captcha_DEFAULT_DIFFICULTY_STRATEGY_broke_my_site_traffic_time=5
    depends_on:
      - mcaptcha_redis

  mcaptcha_redis:
    image: mcaptcha/cache:latest
    container_name: mcaptcha_redis
    restart: unless-stopped